services:
  mongo:
    image: mongo:7
    container_name: smartbite-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbite-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/smartbite
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    depends_on:
      - mongo

volumes:
  mongo_data:
