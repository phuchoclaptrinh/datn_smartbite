services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbite-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: smartbite
      POSTGRES_PASSWORD: smartbite
      POSTGRES_DB: smartbite
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbite -d smartbite"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbite-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://smartbite:smartbite@postgres:5432/smartbite?schema=public
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: smartbite
      DB_PASS: smartbite
      DB_NAME: smartbite
      JWT_SECRET: local-compose-secret-change-for-public-deploy
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:8081
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
